services:
  actual-multi-account-import:
    image: ghcr.io/stephenbrown2/actual-multi-account-import:latest
    # Build locally instead of pulling from GHCR:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: actual-multi-account-import
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      ACTUAL_DATA_DIR: "/data"
      # Set these for your Actual server, omit to use web interface:
      ACTUAL_SERVER_URL: "https://your-actual-server.com"
      ACTUAL_PASSWORD: "your-password"
      # Optional:
      # ACTUAL_SESSION_TOKEN: ""
      # ACTUAL_BUDGET_ID: ""
      # ACTUAL_BUDGET_NAME: ""
      # ACTUAL_SYNC_ID: ""
    volumes:
      - actual_importer_data:/data
      # For watch mode: mount a directory to auto-import when files appear:
      # - ./imports:/imports:ro
    restart: unless-stopped
    # Override command to run CLI instead of web server.
    # Uncomment the imports volume above when using CLI/watch.
    #
    # One-off import:
    # command: >
    #   npm run cli -- /imports/transactions.csv
    #   --server-url=https://your-actual-server.com
    #   --password=your-password
    #   --budget-name="Personal"
    #   --default-account="Checking"
    #   --map-field "date=Date"
    #   --map-field "amount=Amount"
    #   --map-field "payee=Description"
    #   --in-out-mode --out-value "debit"
    #
    # Watch folder (auto-import when files appear):
    # command: >
    #   npm run cli -- watch /imports
    #   --server-url=https://your-actual-server.com
    #   --password=your-password
    #   --budget-name="Personal"
    #   --default-account="Checking"
    #   --map-field "date=Date"
    #   --map-field "amount=Amount"
    #   --map-field "payee=Description"
    #   --in-out-mode --out-value "debit"

volumes:
  actual_importer_data:
