services:
  actual-multi-account-import:
    image: ghcr.io/stephenbrown2/actual-multi-account-import:latest
    # Build locally instead of pulling from GHCR:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: actual-multi-account-import
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      ACTUAL_DATA_DIR: "/data"
      # Required — set these for your Actual server:
      ACTUAL_SERVER_URL: "https://your-actual-server.com"
      ACTUAL_PASSWORD: "your-password"
      # Optional:
      # ACTUAL_SESSION_TOKEN: ""
      # ACTUAL_BUDGET_ID: ""
      # ACTUAL_BUDGET_NAME: ""
      # ACTUAL_SYNC_ID: ""
    volumes:
      - actual_importer_data:/data
    restart: unless-stopped

volumes:
  actual_importer_data:
